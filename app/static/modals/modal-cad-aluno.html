  <!-- Modal: Cadastro / Edição de Aluno (2.c) -->
  <div id="modal-cad-aluno" class="modal-overlay">
    <div class="modal-content" style="max-width: 780px; padding: 22px 26px;">
      <div class="modal-header" style="margin-bottom: 14px; padding-bottom: 10px;">
        <h3 id="modal-cad-aluno-titulo">Novo Cadastro de Aluno</h3>
        <button class="btn-close-modal" onclick="fecharModal('modal-cad-aluno')">&times;</button>
      </div>
      <form id="form-cad-aluno" onsubmit="salvarNovoAluno(event)">
        <input type="hidden" id="cad-alu-id">
        
        <div class="modal-row" style="margin-bottom: 10px;">
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Código da Escola</label>
            <select id="cad-alu-escola-select" class="modal-select" onchange="atualizarNomeEscolaPorCodigo(this.value)" required>
              <!-- Preenchido via JS com as escolas cadastradas -->
            </select>
          </div>
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Nome da Escola</label>
            <input type="text" id="cad-alu-escola-nome" class="modal-input" readonly style="background: #f1f5f9;">
          </div>
        </div>

        <div class="modal-row" style="margin-bottom: 10px;">
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Código do Aluno (Sequencial)</label>
            <input type="text" id="cad-alu-codigo" class="modal-input" placeholder="XXXX" readonly style="background: #f1f5f9; font-family: monospace;">
          </div>
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Código INEP do Estudante</label>
            <input type="text" id="cad-alu-inep" class="modal-input" placeholder="Ex: 12849588" required>
          </div>
        </div>

        <div class="modal-form-group" style="margin-bottom: 10px;">
          <label>Nome Completo do Aluno</label>
          <input type="text" id="cad-alu-nome" class="modal-input" placeholder="Ex: Gabriel Henrique da Silva" required>
        </div>

        <div class="modal-row" style="margin-bottom: 10px;">
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Nome do Responsável</label>
            <input type="text" id="cad-alu-responsavel" class="modal-input" placeholder="Ex: Ana Paula da Silva" required>
          </div>
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Telefone do Responsável</label>
            <input type="text" id="cad-alu-tel-resp" class="modal-input" placeholder="Ex: 66 99 9 9123-8877" required>
          </div>
        </div>

        <div class="modal-form-group" style="margin-bottom: 10px;">
          <label>Endereço Residencial do Aluno</label>
          <input type="text" id="cad-alu-endereco" class="modal-input" placeholder="Ex: Rua 10, nº 250 - Setor Cristalino" required>
        </div>

        <div class="modal-row" style="grid-template-columns: 2fr 1fr 1fr; margin-bottom: 14px;">
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Turma</label>
            <select id="cad-alu-turma" class="modal-select" onchange="aoSelecionarTurmaAluno(this.value)" required>
              <option value="">Selecione uma Turma</option>
            </select>
          </div>
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Sala</label>
            <input type="text" id="cad-alu-sala" class="modal-input" placeholder="Ex: Sala 04" required>
          </div>
          <div class="modal-form-group" style="margin-bottom: 0;">
            <label>Turno</label>
            <select id="cad-alu-turno" class="modal-select">
              <option value="Matutino">Matutino</option>
              <option value="Vespertino">Vespertino</option>
              <option value="Integral">Integral</option>
            </select>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
          <button type="button" class="btn btn-secondary" onclick="fecharModal('modal-cad-aluno')">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-aluno">Cadastrar Aluno</button>
        </div>
      </form>
    </div>

  </div>
